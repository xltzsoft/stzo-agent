name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [ "v$PKG_VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG_VERSION"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: node --check server/server.mjs && bash -n server/public/install.sh

      - name: Pack
        id: pack
        run: |
          mkdir -p out
          npm pack --pack-destination out
          TARBALL="stzo-agent-${{ steps.v.outputs.version }}.tgz"
          test -f "out/$TARBALL"
          SHA="$(sha256sum "out/$TARBALL" | cut -d' ' -f1)"
          node -e '
            const [version, tag, tarball, sha256] = process.argv.slice(1);
            const m = { version, tag, tarball, sha256, node: ">=22.19.0", published_at: new Date().toISOString() };
            require("fs").writeFileSync("out/latest.json", JSON.stringify(m, null, 2) + "\n");
          ' "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.tag }}" "$TARBALL" "$SHA"
          cp server/public/install.sh server/public/install.ps1 out/
          (cd out && sha256sum * > SHA256SUMS)
          cat out/latest.json

      - name: Smoke test installed package
        run: |
          npm install -g ./out/stzo-agent-${{ steps.v.outputs.version }}.tgz
          STZO_HOME="$RUNNER_TEMP/stzo-home" stzo --version
          STZO_HOME="$RUNNER_TEMP/stzo-home" stzo help | head -3

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          NOTES="$(node scripts/changelog-section.mjs "${{ steps.v.outputs.version }}")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "STZO Agent $TAG" --notes "$NOTES"
          fi
